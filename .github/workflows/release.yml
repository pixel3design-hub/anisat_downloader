name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test estensione
        run: node --test extension/tests/parse.test.mjs
      - name: test servizio
        run: cargo test --manifest-path service/Cargo.toml

  # Linux: x86_64 su runner standard, aarch64 su runner arm nativo
  build-linux:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --manifest-path service/Cargo.toml --target ${{ matrix.target }}
      - name: impacchetta
        run: |
          mkdir -p dist
          cp "service/target/${{ matrix.target }}/release/anisat-feed" dist/
          cp README.md COPYING dist/
          cp packaging/icon.png dist/anisat-feed.png
          tar -C dist -czf "anisat-feed-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: anisat-feed-${{ matrix.target }}
          path: anisat-feed-*.tar.gz

  # Windows: x86_64 nativo, aarch64 cross con i tool MSVC arm64
  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: amd64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - run: cargo build --release --manifest-path service/Cargo.toml --target ${{ matrix.target }}
      - name: impacchetta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "service/target/${{ matrix.target }}/release/anisat-feed.exe" dist/
          Copy-Item README.md,COPYING dist/
          Copy-Item packaging/icon.png dist/anisat-feed.png
          Compress-Archive -Path dist/* -DestinationPath "anisat-feed-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: anisat-feed-${{ matrix.target }}
          path: anisat-feed-*.zip

  deb-rpm:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            pkg_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            pkg_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anisat-feed-${{ matrix.target }}
      - name: estrai binario
        run: |
          mkdir -p pkg dist
          tar -xzf "anisat-feed-${{ matrix.target }}.tar.gz" -C pkg
      - name: installa nfpm
        run: |
          curl -sSL -o nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tar.gz nfpm
          chmod +x nfpm
      - name: pacchetti deb e rpm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          PKG_ARCH="${{ matrix.pkg_arch }}" ./nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          PKG_ARCH="${{ matrix.rpm_arch }}" ./nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: [build-linux, build-windows, deb-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}"
